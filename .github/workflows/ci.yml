name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare checksum-pinned S3 compatibility fixture
        if: ${{ hashFiles('backend/file-storage-provider-s3/pom.xml') != '' }}
        timeout-minutes: 5
        run: make prepare-s3-fixture
      - name: Verify foundation, hygiene and domain build
        run: make ci
      - name: Inventory staging runtime package
        run: python3 scripts/staging-build-evidence.py backend/file-storage-runtime/target/file-storage-runtime-0.0.1-SNAPSHOT.jar backend/file-storage-runtime/target/staging-inventory.json
      - name: Offline Maven vulnerability review evidence
        run: python3 scripts/staging-osv-scan.py backend/file-storage-runtime/target
      - name: Collect artifact-bound license and notice evidence
        run: python3 scripts/staging-license-evidence.py backend/file-storage-runtime/target
      - name: Bind CycloneDX and packaged runtime review evidence
        run: python3 scripts/staging-release-evidence.py backend/file-storage-runtime/target
      - name: Retain candidate evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-release-evidence
          path: |
            backend/file-storage-runtime/target/bom.json
            backend/file-storage-runtime/target/staging-inventory.json
            backend/file-storage-runtime/target/staging-provenance.json
            backend/file-storage-runtime/target/staging-release-review.json
            backend/file-storage-runtime/target/staging-osv.json
            backend/file-storage-runtime/target/staging-osv-meta.json
            backend/file-storage-runtime/target/staging-license-evidence.json
            backend/file-storage-runtime/target/staging-license-notices.zip
          if-no-files-found: error
          retention-days: 14
      - name: A17 security regression gate
        run: |
          python3 scripts/staging-security-gate.py --self-test
          python3 scripts/staging-security-gate.py backend/file-storage-runtime/target
