{
  "openapi": "3.1.0",
  "info": {
    "title": "VyrnForge File Storage — Backend Administration",
    "version": "0.1.0-draft",
    "description": "Isolated platform-level administrative contract. No tenant header. LIST/REGISTER require global authority; others exact backend. Validation uses server-owned target policy and validator; request cannot assert validation. No published or live API."
  },
  "security": [
    {
      "bearer": []
    }
  ],
  "paths": {
