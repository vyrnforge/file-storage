        "operationId": "registerBackend",
        "parameters": [
          {
            "$ref": "#/components/parameters/Correlation"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Register"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Logical result; no physical settings or credential references.",
            "headers": {
              "X-Correlation-Id": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "X-Request-Id": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Registered"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
