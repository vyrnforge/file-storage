  "components": {
    "securitySchemes": {
      "bearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "Correlation": {
        "name": "X-Correlation-Id",
        "in": "header",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "Backend": {
        "name": "backendId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "After": {
        "name": "after",
        "in": "query",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "Before": {
        "name": "before",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 0,
          "format": "int64",
          "default": 0
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 50
        }
      }
    },
    "schemas": {
      "Register": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "provider",
          "endpoint",
          "region",
          "addressing",
          "credentialRef"
        ],
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "S3",
              "OSS"
            ]
          },
          "endpoint": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024,
            "format": "uri",
            "writeOnly": true
          },
          "region": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "addressing": {
            "type": "string",
            "enum": [
              "AUTO",
              "PATH",
              "VIRTUAL_HOST",
              "CNAME"
            ]
          },
          "credentialRef": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^ref:[A-Za-z0-9/_:.-]+$",
            "writeOnly": true
          }
        }
      },
      "LocationInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "bucket",
          "prefix"
        ],
        "properties": {
          "bucket": {
            "type": "string",
            "minLength": 1,
            "maxLength": 63,
            "writeOnly": true
          },
          "prefix": {
            "type": "string",
            "maxLength": 512,
            "writeOnly": true
          }
        }
      },
      "CredentialInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedRevision",
          "credentialRef"
        ],
        "properties": {
          "expectedRevision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          },
          "credentialRef": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^ref:[A-Za-z0-9/_:.-]+$",
            "writeOnly": true
          }
        }
      },
      "RevisionInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          }
        }
      },
      "ActivateInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedRevision",
          "candidateRevision"
        ],
        "properties": {
          "expectedRevision": {
            "type": "integer",
            "minimum": 0,
            "format": "int64"
          },
          "candidateRevision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          }
        }
      },
      "Registered": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "backendId",
          "revision"
        ],
        "properties": {
          "backendId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          }
        }
      },
      "Location": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "locationId",
          "backendId"
        ],
        "properties": {
          "locationId": {
            "type": "string",
            "format": "uuid"
          },
          "backendId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Backend": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "backendId",
          "provider",
          "latestRevision",
          "activeRevision"
        ],
        "properties": {
          "backendId": {
            "type": "string",
            "format": "uuid"
          },
          "provider": {
            "type": "string",
            "enum": [
              "S3",
              "OSS"
            ]
          },
          "latestRevision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          },
          "activeRevision": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1,
            "format": "int64"
          }
        }
      },
      "Revision": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "backendId",
          "provider",
          "revision",
          "status",
          "validated"
        ],
        "properties": {
          "backendId": {
            "type": "string",
            "format": "uuid"
          },
          "provider": {
            "type": "string",
            "enum": [
              "S3",
              "OSS"
            ]
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          },
          "status": {
            "type": "string",
            "enum": [
              "DRAFT",
              "ACTIVE",
              "DRAINING",
              "RETIRED"
            ]
          },
          "validated": {
            "type": "boolean"
          }
        }
      },
      "Changed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "correlationId",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID",
              "AUTHENTICATION_FAILED",
              "ACCESS_DENIED",
              "DENIED",
              "NOT_FOUND",
              "CONFLICT",
              "IN_PROGRESS",
              "NO_PLACEMENT",
              "UNAVAILABLE",
              "PAYLOAD_TOO_LARGE",
              "UNSUPPORTED_MEDIA",
              "NOT_ACCEPTABLE",
              "METHOD_NOT_ALLOWED"
            ]
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    },
    "responses": {
      "Error": {
        "description": "Neutral 400/401/403/404/405/406/409/413/415/503; no private provider details.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
